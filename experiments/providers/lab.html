<!doctype html><html lang="fa" dir="rtl" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BaleVPN · Provider Lab</title><link rel="stylesheet" href="/lab.css"><script defer src="/lab-ui.cjs"></script></head>
<body><main class="app"><header class="topbar"><a class="brand" href="/">B<span>⁺</span><b>Provider Lab</b></a><div class="top-actions"><button id="language" type="button">EN</button><button id="theme" type="button" aria-label="Theme">◐</button><button id="lock" type="button" data-i18n="lock">قفل نشست‌ها</button></div></header>
<div class="workspace"><aside><span class="eyebrow" data-i18n="providers">بستر اتصال</span><nav id="providers" aria-label="Providers"><button type="button" data-provider="igap"><span class="provider-icon igap">i</span><span data-i18n="igap">آی‌گپ</span><small data-i18n="loginLab">ورود آزمایشی</small></button><button type="button" data-provider="eitaa"><span class="provider-icon eitaa">E</span><span data-i18n="eitaa">ایتا</span><small data-i18n="research">در بررسی</small></button><button type="button" data-provider="nasim"><span class="provider-icon nasim">N</span><span data-i18n="nasim">نسیم رضوان</span><small data-i18n="research">در بررسی</small></button><button type="button" data-provider="rubika"><span class="provider-icon rubika">R</span><span data-i18n="rubika">روبیکا</span><small data-i18n="research">در بررسی</small></button></nav><div class="sidebar-note"><span class="dot"></span><span data-i18n="isolated">دادهٔ مستقل از بله</span></div></aside>
<section class="content"><div class="heading"><div><span class="eyebrow" data-i18n="workspace">آزمایش اتصال‌دهنده‌ها</span><h1 id="providerTitle">آی‌گپ</h1></div><span class="phase-badge" data-i18n="notTunnel">تونل هنوز تأیید نشده</span></div>
<section id="vaultPanel" class="vault"><div class="vault-copy"><span class="mini-icon">⌑</span><div><h2 data-i18n="vault">مخزن رمزگذاری‌شدهٔ نشست‌ها</h2><span id="vaultStatus" role="status"></span></div><button class="help" type="button" data-help="vaultHelp" aria-label="Help">ⓘ</button></div><form id="unlockForm"><input id="vaultPassword" type="password" minlength="12" maxlength="1024" autocomplete="current-password" required><button class="primary" id="unlock" type="submit" data-i18n="unlock">بازکردن مخزن</button></form></section>
<div id="message" class="message" role="status" aria-live="polite" hidden></div>
<section id="igapPanel" class="provider-panel"><div class="section-heading"><h2 data-i18n="accounts">حساب‌های آزمایشی</h2><button type="button" class="help" data-help="accountsHelp" aria-label="Help">ⓘ</button></div><div id="accounts" class="account-grid"></div></section>
<section id="researchPanel" class="research-panel" hidden><span class="research-mark">⌘</span><h2 data-i18n="researchTitle">مسیر تماس در حال پیاده‌سازی است</h2><p id="researchStatus"></p><a id="officialLink" target="_blank" rel="noopener noreferrer" data-i18n="official">بازکردن نسخهٔ رسمی</a></section>
<footer><span data-i18n="localOnly">پنل محلی · بدون ثبت کد و رمز در گزارش</span><span class="technical">127.0.0.1</span></footer></section></div></main></body></html>
