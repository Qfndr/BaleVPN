name: Refresh security lockfiles
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve patched dependencies
        shell: bash
        run: |
          set -euo pipefail
          for workspace in lk-signaling-rust bale-signaling-rust lktunnel-rust bale-vpn-rust bale-vpn-android/rust; do
            args=()
            for package in tokio rustls rustls-webpki quinn-proto webpki-roots h2 anyhow; do
              if grep -q "^name = \"$package\"$" "$workspace/Cargo.lock"; then
                spec="$package"
                if [[ "$package" == webpki-roots ]]; then spec="webpki-roots@1"; fi
                args+=(-p "$spec")
              fi
            done
            cargo update --manifest-path "$workspace/Cargo.toml" "${args[@]}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: patched-lockfiles
          path: |
            lk-signaling-rust/Cargo.lock
            bale-signaling-rust/Cargo.lock
            lktunnel-rust/Cargo.lock
            bale-vpn-rust/Cargo.lock
            bale-vpn-android/rust/Cargo.lock
