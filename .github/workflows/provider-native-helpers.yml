name: Provider native helpers (experimental)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provider-native-helpers.yml'
      - 'lktunnel-rust/Cargo.*'
      - 'lktunnel-rust/lktunnel/Cargo.toml'
      - 'lktunnel-rust/lktunnel/src/**'
      - 'lktunnel-rust/lktunnel/examples/**'
      - 'lk-signaling-rust/**'
      - 'vendor/webrtc-*/**'
      - 'vendor/livekit-api/**'
      - 'experiments/providers/relay-media-bridge.cjs'
      - 'experiments/nasim/*.cjs'
      - 'experiments/eitaa/*.cjs'
      - 'experiments/eitaa/*-schema.json'
      - 'experiments/rubika/*.cjs'
      - 'scripts/eitaa-media-fixture-adapter.cjs'
      - 'scripts/rubika-media-fixture-adapter.cjs'
      - 'scripts/eitaa-native-call-fixture.cjs'
      - 'scripts/rubika-native-call-fixture.cjs'
      - 'scripts/eitaa-call-session-fixture.cjs'
      - 'scripts/eitaa-call-fixtures.cjs'
      - 'scripts/rubika-account-media-fixture.cjs'
      - 'scripts/relay-native-fixtures.cjs'
      - 'scripts/test-nasim-native.cjs'
      - 'scripts/test-nasim-auth.cjs'
      - 'scripts/test-nasim-signaling.cjs'
      - 'scripts/test-nasim-cleanup-intent.cjs'
      - 'scripts/nasim-call-fixture.cjs'
      - 'scripts/test-eitaa-native.cjs'
      - 'scripts/test-rubika-native.cjs'
      - 'scripts/test-rubika-call-session.cjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/provider-native-helpers.yml'
      - 'lktunnel-rust/**'
      - 'lk-signaling-rust/**'
      - 'vendor/webrtc-*/**'
      - 'vendor/livekit-api/**'
      - 'experiments/nasim/*.cjs'
      - 'experiments/eitaa/*.cjs'
      - 'experiments/eitaa/*-schema.json'
      - 'experiments/rubika/*.cjs'
      - 'experiments/providers/relay-media-bridge.cjs'
      - 'scripts/eitaa-media-fixture-adapter.cjs'
      - 'scripts/rubika-media-fixture-adapter.cjs'
      - 'scripts/eitaa-native-call-fixture.cjs'
      - 'scripts/rubika-native-call-fixture.cjs'
      - 'scripts/eitaa-call-session-fixture.cjs'
      - 'scripts/eitaa-call-fixtures.cjs'
      - 'scripts/rubika-account-media-fixture.cjs'
      - 'scripts/relay-native-fixtures.cjs'
      - 'scripts/test-*-native.cjs'
      - 'scripts/test-nasim-auth.cjs'
      - 'scripts/test-nasim-signaling.cjs'
      - 'scripts/test-nasim-cleanup-intent.cjs'
      - 'scripts/nasim-call-fixture.cjs'
      - 'scripts/test-rubika-call-session.cjs'

permissions:
  contents: read

concurrency:
  group: provider-native-helpers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-helpers:
    name: Experimental helpers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure isolated build and test storage
        run: |
          printf '%s\n' "TEMP=$RUNNER_TEMP" "TMP=$RUNNER_TEMP" "TMPDIR=$RUNNER_TEMP" "CARGO_HOME=$RUNNER_TEMP/provider-cargo" "CARGO_TARGET_DIR=$RUNNER_TEMP/provider-target" "PROVIDER_ARTIFACT_DIR=$RUNNER_TEMP/provider-helper-artifacts" "PYTHONDONTWRITEBYTECODE=1" "CARGO_TERM_COLOR=never" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Rubika call update ordering
        run: node --test scripts/test-rubika-call-session.cjs
      - name: Verify Nasim session recovery and call cleanup
        run: node --test scripts/test-nasim-auth.cjs scripts/test-nasim-signaling.cjs scripts/test-nasim-cleanup-intent.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/provider-cargo/registry
            ${{ runner.temp }}/provider-cargo/git
            ${{ runner.temp }}/provider-target
          key: provider-helpers-${{ matrix.os }}-${{ hashFiles('lktunnel-rust/Cargo.lock', 'lktunnel-rust/**/Cargo.toml', 'vendor/webrtc-*/Cargo.toml') }}
          restore-keys: |
            provider-helpers-${{ matrix.os }}-
      - name: Gate new Nasim routing and SDP policy regressions
        run: |
          mkdir -p "$PROVIDER_ARTIFACT_DIR"
          cargo test --manifest-path lktunnel-rust/Cargo.toml --locked -p lktunnel --lib nasim_ -- --test-threads=1 2>&1 | tee "$PROVIDER_ARTIFACT_DIR/rust-nasim-policy.txt"
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          report = (Path(os.environ['PROVIDER_ARTIFACT_DIR']) / 'rust-nasim-policy.txt').read_text(encoding='utf-8')
          summaries = re.findall(r'^test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured;', report, re.MULTILINE)
          if summaries != [('12', '0', '0', '0')]:
              raise SystemExit('Nasim policy gate requires all 12 tests without failures or skipped cases')
          for module, expected in (('nasim_route_policy', 8), ('nasim_media_policy', 2)):
              if len(re.findall(r'^test ' + module + r'::tests::[^ ]+ \.\.\. ok\s*$', report, re.MULTILINE)) != expected:
                  raise SystemExit('Nasim policy module coverage is incomplete')
          if not re.search(r'^test peer_media::tests::asymmetric_nasim_route_keeps_client_on_turn_and_authenticates_quic \.\.\. ok\s*$', report, re.MULTILINE):
              raise SystemExit('Actual asymmetric TURN/QUIC test did not execute')
          if not re.search(r'^test peer_media::tests::nasim_stale_verifier_cannot_cancel_new_selection_task \.\.\. ok\s*$', report, re.MULTILINE):
              raise SystemExit('Stale route verifier regression did not execute')
          PY
      - name: Check that relay-only ICE cannot gather direct candidates without TURN
        run: cargo test --manifest-path lktunnel-rust/Cargo.toml --locked -p lktunnel --lib rtc::remote_ice_tests::relay_only_gathers_no_direct_candidates_without_turn -- --exact
      - name: Build the three real native helpers
        run: >-
          cargo build --manifest-path lktunnel-rust/Cargo.toml -p lktunnel
          --locked --release --example nasim_relay_bridge
          --example eitaa_relay_bridge --example rubika_relay_bridge
      - name: Build the isolated Nasim TURN diagnostic
        run: cargo build --manifest-path lktunnel-rust/Cargo.toml -p lktunnel --locked --release --example nasim_turn_probe
      - name: Stage experimental artifacts and bind tests to these executables
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys

          directory = Path(os.environ['PROVIDER_ARTIFACT_DIR'])
          directory.mkdir(parents=True, exist_ok=True)
          suffix = '.exe' if sys.platform == 'win32' else ''
          helpers = []
          diagnostic_helpers = []
          node = subprocess.check_output(['node', '-p', 'process.execPath'], text=True).strip()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as environment:
              for provider in ('nasim', 'eitaa', 'rubika'):
                  name = provider + '_relay_bridge' + suffix
                  source = Path(os.environ['CARGO_TARGET_DIR']) / 'release' / 'examples' / name
                  target = directory / name
                  shutil.copy2(source, target)
                  helpers.append({'provider': provider, 'file': name, 'bytes': target.stat().st_size,
                                  'sha256': hashlib.sha256(target.read_bytes()).hexdigest()})
                  environment.write('BALEVPN_' + provider.upper() + '_BRIDGE=' + str(target) + '\n')
              for provider in ('EITAA', 'RUBIKA'):
                  environment.write('BALEVPN_' + provider + '_ADAPTER_NODE=' + node + '\n')
          name = 'nasim_turn_probe' + suffix
          target = directory / name
          shutil.copy2(Path(os.environ['CARGO_TARGET_DIR']) / 'release' / 'examples' / name, target)
          diagnostic_helpers.append({'provider': 'nasim', 'file': name, 'bytes': target.stat().st_size,
                                     'sha256': hashlib.sha256(target.read_bytes()).hexdigest()})
          manifest = {'format': 1, 'scope': 'experimental-lab-only',
                      'sourceCommit': os.environ['GITHUB_SHA'], 'platform': os.environ['RUNNER_OS'],
                      'architecture': 'x86_64', 'helpers': helpers,
                      'diagnosticHelpers': diagnostic_helpers,
                      'testScope': 'native lifecycle, local TURN/DTLS/RTP/QUIC interoperability, provider codec projection and proxy target filtering',
                      'nativeTestsPassed': False,
                      'liveProviderCallsVerified': False, 'operatorBillingVerified': False}
          (directory / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Test actual helpers with all native cases enabled
        run: |
          node --test --test-reporter=tap --test-concurrency=1 scripts/test-nasim-native.cjs scripts/test-eitaa-native.cjs scripts/test-rubika-native.cjs | tee "$PROVIDER_ARTIFACT_DIR/native-tests.tap"
      - name: Test existing real-media and helper interoperability cases
        run: |
          cargo test --manifest-path lktunnel-rust/Cargo.toml -p lktunnel --locked --release --lib peer_media::tests:: -- --ignored --test-threads=1 2>&1 | tee "$PROVIDER_ARTIFACT_DIR/rust-peer-media.txt"
          cargo test --manifest-path lktunnel-rust/Cargo.toml -p lktunnel --locked --release --lib peer_media::tests::real_relay_only_webrtc_carries_mutually_authenticated_quic_without_byte_changes -- --exact --test-threads=1 2>&1 | tee "$PROVIDER_ARTIFACT_DIR/rust-retained-candidates.txt"
          for provider in nasim eitaa rubika; do
            cargo test --manifest-path lktunnel-rust/Cargo.toml -p lktunnel --locked --release --example "${provider}_relay_bridge" two_actual_helpers_negotiate_relay_quic_and_keep_ssrf_protection -- --ignored --test-threads=1 2>&1 | tee "$PROVIDER_ARTIFACT_DIR/rust-${provider}-helpers.txt"
          done
      - name: Test isolated TURN diagnostic against the local fixture
        run: |
          cargo test --manifest-path lktunnel-rust/Cargo.toml -p lktunnel --locked --release --example nasim_turn_probe -- --test-threads=1 2>&1 | tee "$PROVIDER_ARTIFACT_DIR/rust-turn-probe.txt"
      - name: Require every native and interoperability test to pass
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re

          directory = Path(os.environ['PROVIDER_ARTIFACT_DIR'])
          report_path = directory / 'native-tests.tap'
          report = report_path.read_text(encoding='utf-8')
          for field in ('skipped', 'fail', 'cancelled'):
              if not re.search(r'^# ' + field + r' 0\s*$', report, re.MULTILINE):
                  raise SystemExit('Actual native helper tests require zero ' + field)
          total = re.search(r'^# tests (\d+)\s*$', report, re.MULTILINE)
          passed = re.search(r'^# pass (\d+)\s*$', report, re.MULTILINE)
          if total is None or passed is None or int(total.group(1)) != 48 or total.group(1) != passed.group(1):
              raise SystemExit('Actual native helper test report is incomplete')
          manifest_path = directory / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          rust_tests = {}
          for name, expected in (('peer-media', 4), ('retained-candidates', 1), ('nasim-helpers', 1), ('eitaa-helpers', 1), ('rubika-helpers', 1)):
              path = directory / ('rust-' + name + '.txt')
              report_text = path.read_text(encoding='utf-8')
              summaries = re.findall(r'^test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured;', report_text, re.MULTILINE)
              if summaries != [(str(expected), '0', '0', '0')]:
                  raise SystemExit('Unexpected interoperability result for ' + name)
              if name == 'retained-candidates' and not re.search(r'^test peer_media::tests::real_relay_only_webrtc_carries_mutually_authenticated_quic_without_byte_changes \.\.\. ok\s*$', report_text, re.MULTILINE):
                  raise SystemExit('Retained candidate regression did not execute')
              rust_tests[name] = {'passed': expected, 'failed': 0, 'ignored': 0,
                                  'report': path.name, 'reportSha256': hashlib.sha256(path.read_bytes()).hexdigest()}
          manifest['nativeTestsPassed'] = True
          manifest['rustInteropTests'] = rust_tests
          path = directory / 'rust-turn-probe.txt'
          report_text = path.read_text(encoding='utf-8')
          summaries = re.findall(r'^test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured;', report_text, re.MULTILINE)
          if summaries != [('6', '0', '0', '0')]:
              raise SystemExit('TURN diagnostic fixture tests are incomplete')
          for test in ('two_owned_allocations_exchange_exact_nonces', 'rejected_credentials_are_redacted_and_bounded', 'strict_input_has_no_separate_destination_or_extra_keys', 'production_guard_rejects_private_reserved_and_mapped_addresses', 'stun_payload_decodes_as_a_32_byte_binding_request_with_padding', 'two_owned_allocations_exchange_exact_stun_binding_requests'):
              if not re.search(r'^test tests::' + test + r' \.\.\. ok\s*$', report_text, re.MULTILINE):
                  raise SystemExit('TURN diagnostic regression did not execute')
          manifest['diagnosticTests'] = {'turnProbe': {'passed': 6, 'failed': 0, 'ignored': 0,
                                        'report': path.name, 'reportSha256': hashlib.sha256(path.read_bytes()).hexdigest()}}
          policy_path = directory / 'rust-nasim-policy.txt'
          policy_report = policy_path.read_text(encoding='utf-8')
          if re.findall(r'^test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured;', policy_report, re.MULTILINE) != [('12', '0', '0', '0')]:
              raise SystemExit('Nasim policy gate evidence is incomplete')
          manifest['diagnosticTests']['nasimPolicy'] = {'passed': 12, 'failed': 0, 'ignored': 0,
              'report': policy_path.name, 'reportSha256': hashlib.sha256(policy_path.read_bytes()).hexdigest()}
          manifest['nativeTests'] = {'passed': int(total.group(1)), 'skipped': 0,
                                     'report': report_path.name,
                                     'reportSha256': hashlib.sha256(report_path.read_bytes()).hexdigest()}
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Upload experimental helper binaries and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-native-helpers-experimental-${{ matrix.os }}
          path: ${{ runner.temp }}/provider-helper-artifacts
          if-no-files-found: ignore
          retention-days: 7
