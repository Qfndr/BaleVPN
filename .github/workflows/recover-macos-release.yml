name: Recover macOS ARM release

# Alternate native ARM image for temporary macos-latest capacity shortages.
# Builds the exact existing release tag, never a moving branch.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
      runner:
        description: Alternate native ARM runner image
        required: true
        default: macos-15
        type: choice
        options: [macos-15, macos-14]

permissions:
  contents: write

concurrency:
  group: recover-macos-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Verify release source and native architecture
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(uname -m)" = arm64
          test "$(cat VERSION | tr -d '\r\n')" = "${RELEASE_TAG#v}"
          git show --no-patch --format='%H %s' HEAD

      - uses: dtolnay/rust-toolchain@stable

      - name: Restore native ARM build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bale-vpn-rust/target
          key: recover-macos-${{ inputs.runner }}-${{ hashFiles('bale-vpn-rust/Cargo.lock') }}
          restore-keys: |
            recover-macos-${{ inputs.runner }}-
            bale-vpn-rust-macos-aarch64-

      - name: Test signaling, desktop and browser regressions
        run: |
          cargo test --manifest-path bale-signaling-rust/Cargo.toml --locked --release
          cargo test --manifest-path bale-vpn-rust/Cargo.toml --locked --release --no-default-features
          node --test scripts/test-ui-security.cjs

      - name: Build and stage native GUI and headless binaries
        run: |
          mkdir -p release-staging
          cargo build --manifest-path bale-vpn-rust/Cargo.toml --locked --release
          cp bale-vpn-rust/target/release/bale-vpn release-staging/bale-vpn-gui-macos-aarch64
          cargo build --manifest-path bale-vpn-rust/Cargo.toml --locked --release --no-default-features
          cp bale-vpn-rust/target/release/bale-vpn release-staging/bale-vpn-headless-macos-aarch64
          file release-staging/*
          release-staging/bale-vpn-headless-macos-aarch64 --version

      - uses: actions/upload-artifact@v4
        with:
          name: bale-vpn-macos-aarch64-recovered
          path: release-staging/*
          if-no-files-found: error

      - name: Attach tested binaries to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          gh release upload "$RELEASE_TAG" release-staging/* --clobber --repo "$GITHUB_REPOSITORY"
